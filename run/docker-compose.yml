version: '3.8'

services:
  python-running-helper:
    image: xenlia/campus-running-assistant-for-zsc:latest
    # image: python_runing-python-running-helper:latest
    container_name: python-running-helper
    ports:
      # HTTP端口映射
      - "8480:80"
      # HTTPS端口映射
      - "8843:443"
      # - "5000:5000"
    volumes:
      # SSL证书目录挂载（将宿主机的证书挂载到容器内）。
      # 注意：此挂载未使用 :ro，保持读写是为了支持应用在运行时上传/更新 SSL 证书
      #（例如修复跨文件系统操作、自动续期等）。如果不需要写入，请改为使用 :ro 以提高安全性。
      - ./ssl:/app/ssl
      # 数据库、日志与资源目录；业务配置和账号数据仅保存在数据库中。
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./system_accounts/images:/app/system_accounts/images
      - ./random_background_image:/app/random_background_image

    environment:
      PYTHONUNBUFFERED: "1"
      APP_STORAGE_BACKEND: sqlite
      APP_STORAGE_ROOT: /app
      SQLITE_DATABASE_PATH: /app/data/application.sqlite3
    restart: unless-stopped
    
    # 限制Docker容器日志大小
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # 单个日志文件最大10MB
        max-file: "3"    # 最多保留3个日志文件
        
    networks:
      - python-running-helper-network

networks:
  python-running-helper-network:
    driver: bridge
