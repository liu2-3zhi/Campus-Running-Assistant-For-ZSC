# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.mysql.yml ...
# Edit connection values here. External MySQL only; keep real credentials out of Git.
services:
  python-running-helper:
    environment:
      APP_STORAGE_BACKEND: mysql
      APP_STORAGE_ROOT: /app
      # Explicitly override a legacy value baked into an older image.
      MYSQL_TABLE_PREFIX: ""
      MYSQL_HOST: database.example.com
      MYSQL_PORT: "3306"
      MYSQL_USER: campus_app
      MYSQL_PASSWORD: replace-with-your-own-password
      MYSQL_DATABASE: campus_running
      MYSQL_CONNECT_TIMEOUT: "5"
      MYSQL_READ_TIMEOUT: "15"
      MYSQL_WRITE_TIMEOUT: "15"
      # Mount a trusted CA at this path before setting a nonempty value.
      MYSQL_SSL_CA: ""
